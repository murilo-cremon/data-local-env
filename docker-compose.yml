x-airflow-common: &airflow-common
  image: apache/airflow:2.9.2
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_AIRFLOW_USER}:${POSTGRES_AIRFLOW_PASSWORD}@postgres-airflow:5432/${POSTGRES_AIRFLOW_DB}
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW_CONN_POSTGRES_OLTP: postgresql://${POSTGRES_OLTP_USER}:${POSTGRES_OLTP_PASSWORD}@postgres-oltp:5432/${POSTGRES_OLTP_DB}
    AIRFLOW_CONN_MINIO_S3: aws://${MINIO_ACCESS_KEY}:${MINIO_SECRET_KEY}@?endpoint_url=http%3A%2F%2Fminio%3A9000&region_name=us-east-1
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
    MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    POSTGRES_OLTP_HOST: postgres-oltp
    POSTGRES_OLTP_PORT: 5432
    POSTGRES_OLTP_DB: ${POSTGRES_OLTP_DB}
    POSTGRES_OLTP_USER: ${POSTGRES_OLTP_USER}
    POSTGRES_OLTP_PASSWORD: ${POSTGRES_OLTP_PASSWORD}
  depends_on: &airflow-common-depends-on
    postgres-airflow:
      condition: service_healthy
  networks:
    - data-network

services:

  # ─────────────────────────────────────────────
  # PostgreSQL — OLTP (fonte dos dados)
  # ─────────────────────────────────────────────
  postgres-oltp:
    image: postgres:16
    container_name: postgres-oltp
    restart: unless-stopped
    environment:
      1: ${POSTGRES_OLTP_DB}
      POSTGRES_USER: ${POSTGRES_OLTP_USER}
      POSTGRES_PASSWORD: ${POSTGRES_OLTP_PASSWORD}
    ports:
      - "${POSTGRES_OLTP_PORT}:5432"
    volumes:
      - postgres_oltp_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_OLTP_USER}", "-d", "${POSTGRES_OLTP_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data-network

  # ─────────────────────────────────────────────
  # PostgreSQL — Backend do Airflow
  # ─────────────────────────────────────────────
  postgres-airflow:
    image: postgres:16
    container_name: postgres-airflow
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_AIRFLOW_DB}
      POSTGRES_USER: ${POSTGRES_AIRFLOW_USER}
      POSTGRES_PASSWORD: ${POSTGRES_AIRFLOW_PASSWORD}
    ports:
      - "${POSTGRES_AIRFLOW_PORT}:5432"
    volumes:
      - postgres_airflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_AIRFLOW_USER}", "-d", "${POSTGRES_AIRFLOW_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data-network

  # ─────────────────────────────────────────────
  # PostgreSQL — Backend do Metabase
  # ─────────────────────────────────────────────
  postgres-metabase:
    image: postgres:16
    container_name: postgres-metabase
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_METABASE_DB}
      POSTGRES_USER: ${POSTGRES_METABASE_USER}
      POSTGRES_PASSWORD: ${POSTGRES_METABASE_PASSWORD}
    ports:
      - "${POSTGRES_METABASE_PORT}:5432"
    volumes:
      - postgres_metabase_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_METABASE_USER}", "-d", "${POSTGRES_METABASE_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data-network

  # ─────────────────────────────────────────────
  # MinIO — Landing Zone (S3-compatible)
  # ─────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data-network

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY};
        mc mb --ignore-existing local/landing-zone;
        mc mb --ignore-existing local/processed;
        mc mb --ignore-existing local/curated;
        echo 'Buckets criados com sucesso!';
      "
    networks:
      - data-network

  # ─────────────────────────────────────────────
  # Metabase — Visualização e BI
  # ─────────────────────────────────────────────
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    restart: unless-stopped
    ports:
      - "${METABASE_PORT}:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres-metabase
      MB_DB_PORT: 5432
      MB_DB_DBNAME: ${POSTGRES_METABASE_DB}
      MB_DB_USER: ${POSTGRES_METABASE_USER}
      MB_DB_PASS: ${POSTGRES_METABASE_PASSWORD}
    depends_on:
      postgres-metabase:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - data-network

  # ─────────────────────────────────────────────
  # Airflow — Init
  # ─────────────────────────────────────────────
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username ${AIRFLOW_ADMIN_USER} \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email ${AIRFLOW_ADMIN_EMAIL} \
          --password ${AIRFLOW_ADMIN_PASSWORD}
    environment:
      <<: *airflow-common-env
    restart: "no"

  # ─────────────────────────────────────────────
  # Airflow — Scheduler
  # ─────────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────
  # Airflow — Webserver
  # ─────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    restart: unless-stopped
    ports:
      - "${AIRFLOW_WEBSERVER_PORT}:8080"
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
      airflow-scheduler:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  postgres_oltp_data:
  postgres_airflow_data:
  postgres_metabase_data:
  minio_data:

networks:
  data-network:
    driver: bridge
